<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Details page of Eagle Creek Golf Club, Orlando, Florida">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>Eagle Creek Golf Club</title>
</head>

<body>
    <header class="container flex items-center justify-between">
        <a href="/" class="flex gap-2 logo items-center">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-10">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M8.25 21v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21m0 0h4.5V3.545M12.75 21h7.5V10.75M2.25 21h1.5m18 0h-18M2.25 9l4.5-1.636M18.75 3l-1.5.545m0 6.205 3 1m1.5.5-1.5-.5M6.75 7.364V3h-3v18m3-13.636 10.5-3.819" />
            </svg>
            <span>Stay&amp;Play</span>
        </a>

        <div class="flex items-center gap-4">

            <nav class="desktop-nav" aria-label="Main navigation">
                <ul class="flex items-center gap-4">
                    <li><a class="nav-btn nav-btn-text" href="#">HOME</a></li>
                    <li><a class="nav-btn nav-btn-text" href="#">WHERE TO STAY</a></li>
                    <li><a class="nav-btn nav-btn-text" href="#">WHERE TO PLAY</a></li>
                    <li><a class="nav-btn nav-btn-text" href="#">GROUP TRAVEL</a></li>
                </ul>
            </nav>

            <a class="nav-btn nav-btn-text nav-btn-alt" href="#">
                <span class="tee-time-text">BOOK A TEE TIME</span>
                <span class="tee-time-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-4">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M17.25 6.75L22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3l-4.5 16.5" />
                    </svg>
                </span>
            </a>

            <form class="nav-search nav-btn-text" role="search">
                <input type="search" name="q" placeholder="SEARCH" aria-label="Search">

                <button type="submit" aria-label="Submit search">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-4">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                    </svg>
                </button>
            </form>

            <button class="icon-btn menu-btn" type="button" aria-label="Open navigation" aria-expanded="false">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                </svg>
            </button>

        </div>
    </header>
</body>

</html>
